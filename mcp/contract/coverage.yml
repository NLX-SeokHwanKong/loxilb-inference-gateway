# mcp/contract/coverage.yml - the operation manifest of the loxilb-mcp bridge.
#
# One entry per "METHOD path" of api/swagger.yml and api/swagger-extras.yml.
# Enforced by mcp/contract/coverage_test.go (see docs/MCP-OPERATIONS.md,
# "Contract gate"). Every entry is exactly one of:
#   tools: [...]      mapped; carries impact (none|object|tenant|service|global|instance),
#                     reversible (for mutations) and tier (viewer|operator|admin-confirm).
#                     The test derives the minimum tier from impact+reversible; a weaker
#                     tier fails unless tier_gap: states why (counted against the budget).
#   pending: P1a|P1b|P2|P3|P4   not reachable yet; counted against budget.pending_max.
#   excluded: "reason"          will not be reachable; a recorded decision.
# Budgets are ratchets: they may only go down. A raise is a warning in the CI summary.
version: 1
budget:
  pending_max: 84
  tier_gap_max: 16
