# A pool that insists on an Endpoint Picker. kube-loxilb accepts it and leaves
# the picker to the gateway; the picker Service "some-epp" does not exist, so
# FailClose keeps every request off the model servers (503) until it does, and
# a gateway without the "epp" feature gets no rule for the pool at all.
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: epp-required
  namespace: llm
  annotations:
    loxilb.io/epselect: "chwbl"
spec:
  selector:
    matchLabels:
      app: vllm-qwen3
  targetPorts:
    - number: 8000
  endpointPickerRef:
    name: some-epp
    port:
      number: 9002
    failureMode: FailClose
