# The same pool with failureMode FailOpen: an unresolved picker then carries
# nothing, and the rule falls back to loxilb's own endpoint selection, which is
# the fallback the pool declared.
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: epp-required
  namespace: llm
  annotations:
    loxilb.io/epselect: "chwbl"
spec:
  selector:
    matchLabels:
      app: vllm-qwen3
  targetPorts:
    - number: 8000
  endpointPickerRef:
    name: some-epp
    port:
      number: 9002
    failureMode: FailOpen
