name: CI container name safety
on:
  pull_request:
    branches: [main]
    paths: ['cicd/common.sh', 'cicd/common/tests/**', '.github/workflows/ci-container-names.yml']
  push:
    branches: [main]
    paths: ['cicd/common.sh', 'cicd/common/tests/**', '.github/workflows/ci-container-names.yml']
permissions:
  contents: read
jobs:
  names:
    name: exact-container-names
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash -n cicd/common.sh
      - run: python3 -B -m unittest discover -s cicd/common/tests -v
