# CI for the standalone loxilb-mcp module. Runs on PRs and pushes that touch
# mcp/** or the REST contract the bridge is checked against (api/swagger*.yml,
# tools/metric-manifest): vet, test, the contract gate, cross-compile the
# full OS/arch matrix, validate the GoReleaser config with a snapshot build
# (no publish), and run the Stage-1 docker scenario (cicd/mcp) against a
# gateway container. This is what gates a merge — the release workflow only
# runs once a tag is pushed.
name: mcp-ci

on:
  push:
    branches: [main]
    paths:
      - 'mcp/**'
      - 'api/swagger.yml'
      - 'api/swagger-extras.yml'
      - 'tools/metric-manifest/**'
      - 'cicd/mcp/**'
      - '.github/workflows/mcp-ci.yml'
  pull_request:
    paths:
      - 'mcp/**'
      - 'api/swagger.yml'
      - 'api/swagger-extras.yml'
      - 'tools/metric-manifest/**'
      - 'cicd/mcp/**'
      - '.github/workflows/mcp-ci.yml'
  # Manual run on any branch (gh workflow run mcp-ci.yml --ref <branch>):
  # lets a contract-gate change be exercised before a PR exists.
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: mcp

env:
  # The gateway image tag Stage-1 pulls and runs (see the stage1 job, D19).
  STAGE1_IMAGE_TAG: latest-u24

jobs:
  test:
    name: vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: mcp/go.sum
      - run: go vet ./...
      - run: go test -race ./...

  # The bridge <-> REST contract gate (mcp/contract): the operation manifest
  # against swagger and the registered tools, the tier derivation rule, the
  # field contract, the secrets denylist, the metric references, and the
  # generated swagger tables. The tests write their report to the step
  # summary: pending operations by phase, the tier table, the metric backlog.
  contract:
    name: contract gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # origin/main is needed for the budget ratchet
      - uses: actions/setup-go@v5
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: |
            mcp/go.sum
            go.sum
      - name: generated tables are current
        run: |
          go generate ./...
          git diff --exit-code -- . || {
            echo '::error::a generated file is stale (zz_swagger_enums_gen.go from swagger, zz_metrics_reference_gen.go from tools/metric-manifest): run `go generate ./...` in mcp/ and commit the result'
            exit 1
          }
      - name: contract tests
        run: go test -count=1 -v ./contract/...

  # Stage-1 docker scenario: the bridge built from this tree, driven with curl
  # JSON-RPC over streamable HTTP against a loxilb container (llb1) and two
  # nettest hosts on the cicd/common.sh topology — observe, the L4 and typed-AI
  # create -> traffic -> confirm-delete round-trips, the jwt credential policy,
  # viewer guardrails, the API-key lifecycle and the diagnose/report tools.
  # ubuntu-22.04 on purpose: the scenario runs the published :latest gateway
  # image, and common.sh maps a 24.04 host to :latest-u24, whose eBPF
  # programs the 6.x-azure kernel of the hosted 24.04 runner refuses (E2BIG).
  # The ai-ops legs report [SKIP] when the API-key store answers 503 in the
  # plain image; that is the scenario's own verdict, not a failure.
  stage1:
    name: stage-1 docker scenario
    runs-on: ubuntu-22.04
    needs: [test, contract]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cicd/mcp
    steps:
      - uses: actions/checkout@v4   # no submodule: the gateway comes as an image
      - uses: actions/setup-go@v5
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: mcp/go.sum
      # node serves the tcp_server.js backend inside the l3ep1 netns (sudo ip
      # netns exec resolves it from the secure_path, hence the apt package);
      # psmisc provides the killall the scenario's cleanup trap calls.
      - name: scenario host tools
        run: sudo apt-get update && sudo apt-get -y install nodejs iproute2 psmisc
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}
      # D19: Stage-1 drives a main-built gateway image, chosen by this one
      # variable. latest-u24 is rebuilt from main on every push that touches
      # the gateway and daily at 10:00 UTC (docker-image-u24.yml); :latest
      # is a dispatch-only build (docker-image.yml) and lags main by weeks.
      # common.sh honours LOXILB_DOCKER_IMAGE as a bare tag.
      - name: pull the testbed images
        run: |
          docker pull ghcr.io/loxilb-io/loxilb-inference-gateway:${STAGE1_IMAGE_TAG}
          docker pull ghcr.io/loxilb-io/nettest:latest
          docker pull postgres:18.6
          docker run --rm --entrypoint /root/loxilb-io/loxilb/loxilb ghcr.io/loxilb-io/loxilb-inference-gateway:${STAGE1_IMAGE_TAG} --version || true
      - name: config + validation + rmconfig
        env:
          LOXILB_DOCKER_IMAGE: ${{ env.STAGE1_IMAGE_TAG }}
        run: |
          set +e
          {
            ./config.sh
            ./validation.sh
            echo $? > "$RUNNER_TEMP/mcp-stage1.rc"
            ./rmconfig.sh
          } 2>&1 | tee "$RUNNER_TEMP/mcp-stage1.log"
          rc=$(cat "$RUNNER_TEMP/mcp-stage1.rc" 2>/dev/null || echo 1)
          {
            echo '## Stage-1 docker scenario (cicd/mcp)'
            echo
            echo '```'
            grep -E '^(SCENARIO-mcp|###)|^ *\[(OK|FAILED|SKIP|NOTE)\]|store accepting|store provisioned|gateway REST ready|testbed ready' "$RUNNER_TEMP/mcp-stage1.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: upload the scenario log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-stage1-log
          # The log only; .mcp-audit holds the key files the scenario writes.
          path: ${{ runner.temp }}/mcp-stage1.log
          if-no-files-found: ignore

  crosscompile:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: mcp/go.sum
      - name: build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o /tmp/loxilb-mcp ./cmd/loxilb-mcp

  goreleaser-check:
    name: goreleaser config + snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: mcp/go.sum
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: check
          workdir: mcp
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: build --snapshot --clean
          workdir: mcp
