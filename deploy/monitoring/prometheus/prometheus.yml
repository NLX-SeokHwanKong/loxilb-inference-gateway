# Prometheus scrape config for LoxiLB Inference Gateway monitoring.
# Internal monitoring design: scrape access model (revised, F11).
#
# DEFAULT: same-host, network-isolated plaintext scrape of loxilb's plain REST
# listener. Run Prometheus on the loxilb host and bind loxilb's plain listener to
# localhost (--host 127.0.0.1) or firewall :11111. The metrics endpoint is a
# control-plane REST route with Swagger `security: []`; API auth modes do not
# add a bearer check. The API HTTPS listener can separately require and verify
# a scraper client certificate when TLS_CA_CERTIFICATE/--tls-ca is configured.
# Current product profile: no AI-controller, KV-agent, DPU/DOCA, or PII-detection
# scrape job. The Gateway endpoint can still expose source-registered bridge or
# health gauges; default dashboards/rules must not treat those as packaged
# component health. PII detection declares no Prometheus family.
global:
  scrape_interval: 10s      # aligned to loxilb's 10s stats sweep; do not lower
  scrape_timeout: 5s
  external_labels:
    # Identifies this Prometheus's fleet in federated or remote-write setups.
    # External labels are added only to what LEAVES this Prometheus (alerts,
    # federation, remote write), never to its own series, so the recording
    # rules' by (cluster, instance) needs the label on the scraped series:
    # the loxilb job below sets the same value. Set per site, in BOTH places
    # (lint-monitoring fails when they differ).
    cluster: loxilb-default
  evaluation_interval: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: loxilb
    scheme: http
    metrics_path: /netlox/v1/metrics
    # The first event of a series (MON-04). A counter series exists from its
    # first increment, so the first scrape of it already reads 1 and rate()
    # and increase() see no 0 -> 1 step: the first error of a new (model,
    # tenant) pair, or of a fresh process, is invisible to every rate panel
    # and alert. The exporter stamps every counter with its creation time;
    # the protobuf exposition carries that stamp (the text formats do not),
    # and with --enable-feature=created-timestamp-zero-ingestion
    # (docker-compose.yml) Prometheus writes a 0 at that instant before the
    # first sample, so the first increment IS an increase. Keep
    # PrometheusProto first; lint-monitoring.py fails this file without it.
    scrape_protocols: [PrometheusProto, OpenMetricsText1.0.0, OpenMetricsText0.0.1, PrometheusText0.0.4]
    static_configs:
      # loxilb plain REST listener (default :11111). Keep it host-local.
      - targets: ["127.0.0.1:11111"]
        # The cluster of external_labels, on the series themselves: the
        # recording rules group by (cluster, instance) and the alerts by
        # cluster. Same value as external_labels.cluster.
        labels:
          cluster: loxilb-default

    # ---- OPTIONAL: transport encryption across an untrusted network ----------
    # To scrape loxilb over TLS instead, start loxilb with --tls, uncomment the
    # cert bind-mounts + `user: "0"` in docker-compose.yml, run certs/gen-certs.sh,
    # and replace the block above with:
    #   scheme: https
    #   tls_config:
    #     ca_file: /etc/prometheus/certs/rootCA.crt
    #     # Required when the Gateway API listener has --tls-ca configured:
    #     cert_file: /etc/prometheus/certs/client.crt
    #     key_file: /etc/prometheus/certs/client.key
    #   static_configs:
    #     - targets: ["<loxilb-ip>:8091"]   # cert SAN must cover this address
    #       labels:
    #         cluster: loxilb-default       # = external_labels.cluster
    # Alternatively, place an authenticated reverse proxy or service-mesh
    # policy in front of the app-layer unauthenticated endpoint.

  # Prometheus self-monitoring (soak checks use prometheus_tsdb_head_series).
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
